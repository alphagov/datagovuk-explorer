exclude: '^docs/|/migrations/|staticfiles/'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.30.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.20.0
    hooks:
      - id: pyproject-fmt

  # djhtml indents (leading whitespace only — never joins/splits lines);
  # djLint lints. djLint's reformatter is not used: it reflows inline elements.
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.11
    hooks:
      - id: djhtml
        # Match the templates' 2-space indentation.
        entry: djhtml --tabwidth 2
        files: '\.html$'

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      # Our templates are .html (datagovuk's are .jinja), so the jinja-typed
      # hook ids would never match. The plain djlint hook is types_or [html];
      # profile=jinja comes from [tool.djlint] in pyproject.toml.
      - id: djlint
        files: '\.html$'

  # Django models vs migrations drift check — exits non-zero when models.py
  # changes without a matching migration committed (or when a migration
  # diverges from the models). Run via uv so it uses the .venv; --check
  # --dry-run compares models against migration state on disk and needs no
  # database. always_run: a schema change isn't tied to any one file.
  - repo: local
    hooks:
      - id: makemigrations-check
        name: models vs migrations drift check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
